  <text x="60" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20" fill="#0f172a" letter-spacing="-0.5">Tech<tspan fill="#2563eb">Nova</tspan></text>
  <text x="61" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10" fill="#64748b" letter-spacing="2">SOLUTIONS</text>
