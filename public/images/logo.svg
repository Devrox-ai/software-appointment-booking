    <path d="M24 25 L32 20.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M24 25 L16 20.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="24" cy="25" r="2.5" fill="#38bdf8"/>
    <circle cx="24" cy="35" r="1.5" fill="#ffffff"/>
    <circle cx="32" cy="20.5" r="1.5" fill="#ffffff"/>
    <circle cx="16" cy="20.5" r="1.5" fill="#ffffff"/>
